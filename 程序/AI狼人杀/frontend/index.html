<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 狼人杀</title>
  <style>
    /* ============================================================
       AI 狼人杀 — 暗色沉浸 + 昼夜切换 + 丰富动画
       设计参考：PlayStation（深色沉浸）+ Cards Against Humanity
       （高对比戏剧）+ Headspace（温暖暖调）
    ============================================================ */

    :root {
      /* ---- 白天主题（暖调） ---- */
      --bg:         #f5f0e8;
      --bg-elev:    #fffdf7;
      --bg-soft:    #efe9dd;
      --bg-quiet:   #e8e0d2;
      --line:       #d8d0c0;
      --line-strong:#c8bfa8;
      --text:       #1a1814;
      --text-soft:  #3d3830;
      --text-muted: #8a8278;
      --accent:     #c47a20;       /* 温暖琥珀 */
      --accent-hover:#a06018;
      --accent-soft:#fdf0e0;
      --accent-glow:rgba(196,122,32,0.25);
      --good:       #3a7a50;
      --good-soft:  #e2f0e6;
      --good-glow:  rgba(58,122,80,0.2);
      --wolf:       #a84040;
      --wolf-soft:  #f2e2e1;
      --wolf-glow:  rgba(168,64,64,0.2);
      --night-accent:#7b68ee;      /* 夜晚紫色强调 */
      --night-bg:   #0e0e12;
      --night-elev: #16161d;
      --night-soft: #1e1e28;
      --night-line: rgba(255,255,255,0.07);
      --night-text: #e8e4dc;
      --night-soft-text: #9a9690;
      --night-muted: #5a5852;

      --radius:      10px;
      --radius-sm:   7px;
      --radius-lg:   16px;
      --shadow-sm:   0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow:      0 4px 16px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
      --shadow-lg:   0 12px 40px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.08);
      --glow-accent: 0 0 20px var(--accent-glow);

      --font-serif: ui-serif, Georgia, "Times New Roman", "Songti SC", "STSong", serif;
      --font-sans:  ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono:  ui-monospace, "SF Mono", Menlo, monospace;

      --max-width:  1280px;
      --header-h:   56px;

      /* 动画时长 */
      --dur-micro: 150ms;
      --dur-small: 280ms;
      --dur-mid:   450ms;
      --dur-large: 700ms;
      --ease-out:  cubic-bezier(0.22, 0.61, 0.36, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ---- 夜晚主题覆盖 ---- */
    body.night-mode {
      --bg:         var(--night-bg);
      --bg-elev:    var(--night-elev);
      --bg-soft:    var(--night-soft);
      --bg-quiet:   #12121a;
      --line:       var(--night-line);
      --line-strong:#2a2a38;
      --text:       var(--night-text);
      --text-soft:  var(--night-soft-text);
      --text-muted: var(--night-muted);
      --accent:     var(--night-accent);
      --accent-hover:#6356cc;
      --accent-soft:#1e1a3a;
      --accent-glow: rgba(123,104,238,0.3);
      --good-soft:  #0e1f18;
      --good-glow:  rgba(58,122,80,0.15);
      --wolf-soft:  #1f0e0e;
      --wolf-glow:  rgba(168,64,64,0.15);
      --shadow:     0 4px 20px rgba(0,0,0,0.5);
      --shadow-lg:  0 16px 48px rgba(0,0,0,0.6);
      --glow-accent: 0 0 24px rgba(123,104,238,0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      transition: background var(--dur-mid) var(--ease-smooth),
                  color var(--dur-mid) var(--ease-smooth);
    }
    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }
    [x-cloak] { display: none !important; }

    /* ---- 页面切换过渡 ---- */
    .view-transition {
      animation: view-enter var(--dur-large) var(--ease-out) both;
    }
    @keyframes view-enter {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes view-exit {
      from { opacity: 1; transform: translateY(0); }
      to   { opacity: 0; transform: translateY(-8px); }
    }

    /* ============================================================
       Header
    ============================================================ */
    .header {
      display: flex; align-items: center; gap: 14px;
      padding: 0 20px;
      height: var(--header-h);
      border-bottom: 1px solid var(--line);
      background: var(--bg-elev);
      flex-shrink: 0;
      transition: background var(--dur-mid) var(--ease-smooth),
                  border-color var(--dur-mid) var(--ease-smooth);
      position: relative;
      z-index: 50;
    }
    /* 夜晚 header 微光 */
    body.night-mode .header {
      box-shadow: 0 1px 0 rgba(123,104,238,0.08);
    }
    .header .brand {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      transition: color var(--dur-mid) var(--ease-smooth);
    }
    .header .brand-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
      transition: background var(--dur-mid) var(--ease-smooth),
                  box-shadow var(--dur-mid) var(--ease-smooth);
      animation: dot-pulse 3s ease-in-out infinite;
    }
    @keyframes dot-pulse {
      0%, 100% { box-shadow: 0 0 6px var(--accent-glow); transform: scale(1); }
      50%       { box-shadow: 0 0 14px var(--accent-glow); transform: scale(1.15); }
    }
    .header .meta { display: flex; gap: 8px; align-items: center; margin-left: 8px; }
    .header .meta .pill {
      font-size: 12px; color: var(--text-soft);
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      transition: all var(--dur-small) var(--ease-smooth);
    }
    .header .meta .pill.day  { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
    .header .meta .pill.night { background: var(--night-soft); color: var(--night-accent); border-color: var(--night-line); }
    .header .meta .pill.over  { background: var(--accent); color: #fff; border-color: var(--accent); }

    .header .conn {
      margin-left: auto;
      font-size: 11px; color: var(--text-muted);
      transition: color var(--dur-mid) var(--ease-smooth);
    }
    .header .conn.live {
      display: flex; align-items: center; gap: 6px;
      color: var(--good);
    }
    .header .conn.live::before {
      content: ''; width: 6px; height: 6px;
      background: var(--good); border-radius: 50%;
      animation: conn-blink 2s ease-in-out infinite;
    }
    @keyframes conn-blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* TTS 状态指示器 */
    .tts-indicator {
      font-size: 10px;
      color: var(--text-muted);
      padding: 2px 8px;
      border-radius: 20px;
      background: var(--bg-soft);
      border: 1px solid var(--line);
      transition: all var(--dur-small) var(--ease-smooth);
    }
    .tts-indicator.tts-speaking {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: var(--accent);
      animation: tts-ring 1.2s ease-in-out infinite;
    }
    .tts-indicator.tts-error {
      color: var(--wolf);
      background: var(--wolf-soft);
      border-color: var(--wolf);
    }
    @keyframes tts-ring {
      0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
      50%       { box-shadow: 0 0 0 4px var(--accent-glow); }
    }

    /* ============================================================
       主内容区
    ============================================================ */
    .container {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* ============================================================
       面板 / 卡片
    ============================================================ */
    .panel {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      transition: background var(--dur-mid) var(--ease-smooth),
                  border-color var(--dur-mid) var(--ease-smooth),
                  box-shadow var(--dur-mid) var(--ease-smooth),
                  transform var(--dur-small) var(--ease-out);
      overflow: hidden;
    }
    .panel:hover {
      box-shadow: var(--shadow);
      transform: translateY(-1px);
    }
    .panel + .panel { margin-top: 14px; }
    .panel-header {
      padding: 12px 18px;
      border-bottom: 1px solid var(--line);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: all var(--dur-mid) var(--ease-smooth);
    }
    .panel-body { padding: 20px; }

    /* ============================================================
       首页（Lobby）
    ============================================================ */
    .lobby {
      display: flex; align-items: center; justify-content: center;
      height: calc(100vh - var(--header-h));
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    /* 背景装饰 — 夜晚时有星点 */
    .lobby::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 30% 20%, var(--accent-glow) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 80%, var(--good-glow) 0%, transparent 50%);
      opacity: 0.5;
      pointer-events: none;
      transition: opacity var(--dur-mid) var(--ease-smooth);
    }
    body.night-mode .lobby::before {
      background: radial-gradient(ellipse at 20% 30%, rgba(123,104,238,0.12) 0%, transparent 55%),
                  radial-gradient(ellipse at 80% 70%, rgba(168,64,64,0.08) 0%, transparent 50%);
      opacity: 0.8;
    }
    .lobby-card {
      width: 100%; max-width: 460px;
      position: relative;
      z-index: 1;
      animation: lobby-in 0.6s var(--ease-out) both;
    }
    @keyframes lobby-in {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .lobby-card h1 {
      font-family: var(--font-serif);
      font-size: 36px;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
      color: var(--text);
      transition: color var(--dur-mid) var(--ease-smooth);
    }
    /* 标题装饰线 */
    .lobby-card h1::after {
      content: '';
      display: block;
      width: 48px; height: 3px;
      background: linear-gradient(90deg, var(--accent), transparent);
      border-radius: 2px;
      margin-top: 10px;
      transition: width var(--dur-mid) var(--ease-out);
    }
    .lobby-card:hover h1::after { width: 72px; }
    .lobby-card .subtitle {
      font-size: 14px; color: var(--text-muted);
      margin-bottom: 28px;
      transition: color var(--dur-mid) var(--ease-smooth);
    }
    .form-row { margin-bottom: 14px; }
    .form-row label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-soft);
      margin-bottom: 6px;
      letter-spacing: 0.02em;
      transition: color var(--dur-mid) var(--ease-smooth);
    }
    .form-row input,
    .form-row select {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      transition: border-color var(--dur-small) var(--ease-smooth),
                  box-shadow var(--dur-small) var(--ease-smooth),
                  background var(--dur-mid) var(--ease-smooth),
                  color var(--dur-mid) var(--ease-smooth);
    }
    .form-row input:focus,
    .form-row select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .form-row input::placeholder { color: var(--text-muted); }
    .form-divider {
      border: none;
      border-top: 1px solid var(--line);
      margin: 22px 0 18px;
      transition: border-color var(--dur-mid) var(--ease-smooth);
    }
    .form-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 10px;
      padding: 8px 12px;
      background: var(--bg-soft);
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      transition: all var(--dur-mid) var(--ease-smooth);
    }

    /* ============================================================
       按钮
    ============================================================ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 10px 20px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--bg-elev);
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--dur-small) var(--ease-out);
      position: relative;
      overflow: hidden;
    }
    /* 点击波纹 */
    .btn::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.2) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.4s;
    }
    .btn:active::after { opacity: 1; transition: opacity 0s; }
    .btn:hover {
      background: var(--bg-soft);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px var(--accent-glow);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      box-shadow: 0 4px 16px var(--accent-glow);
      transform: translateY(-2px);
    }
    .btn-night-primary {
      background: var(--night-accent);
      border-color: var(--night-accent);
      box-shadow: 0 2px 12px rgba(123,104,238,0.35);
    }
    .btn-night-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      box-shadow: 0 4px 20px rgba(123,104,238,0.5);
    }
    .btn-full { width: 100%; padding: 12px; }
    .btn-sm   { padding: 6px 14px; font-size: 13px; }
    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--text-soft);
    }
    .btn-ghost:hover { background: var(--bg-soft); color: var(--text); transform: none; }

    /* ============================================================
       房间大厅（Waiting）
    ============================================================ */
    .waiting {
      height: calc(100vh - var(--header-h));
      overflow-y: auto;
      padding: 40px 24px;
    }
    .waiting h2 {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
      color: var(--text);
      transition: color var(--dur-mid) var(--ease-smooth);
    }
    .waiting .sub {
      font-size: 13px; color: var(--text-muted);
      margin-bottom: 28px;
      transition: color var(--dur-mid) var(--ease-smooth);
    }
    /* 人数指示动画条 */
    .player-count-bar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 24px;
      padding: 10px 16px;
      background: var(--bg-soft);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      transition: all var(--dur-mid) var(--ease-smooth);
    }
    .player-count-bar .bar-track {
      flex: 1; height: 4px;
      background: var(--line);
      border-radius: 2px;
      overflow: hidden;
    }
    .player-count-bar .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--good));
      border-radius: 2px;
      transition: width 0.5s var(--ease-out);
    }
    body.night-mode .player-count-bar .bar-fill {
      background: linear-gradient(90deg, var(--night-accent), var(--good));
    }
    .player-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }
    .player-tile {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      cursor: default;
      transition: all var(--dur-small) var(--ease-out);
      animation: tile-in 0.4s var(--ease-out) both;
    }
    .player-tile:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-sm);
      transform: translateY(-2px);
    }
    @keyframes tile-in {
      from { opacity: 0; transform: translateY(8px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .player-tile .tile-avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--bg-soft);
      border: 2px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
      font-family: var(--font-serif);
      font-size: 16px;
      flex-shrink: 0;
      transition: all var(--dur-mid) var(--ease-smooth);
    }
    .player-tile .tile-meta { flex: 1; min-width: 0; }
    .player-tile .tile-name {
      font-weight: 500; font-size: 14px;
      display: flex; align-items: center; gap: 5px;
      color: var(--text);
      transition: color var(--dur-mid) var(--ease-smooth);
    }
    .player-tile .tile-tag {
      font-size: 11px; color: var(--text-muted);
      margin-top: 2px;
      transition: color var(--dur-mid) var(--ease-smooth);
    }
    /* 房主标识 */
    .player-tile .tile-host-badge {
      font-size: 10px; padding: 1px 6px;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    body.night-mode .player-tile .tile-host-badge {
      background: rgba(123,104,238,0.15);
      color: var(--night-accent);
    }

    /* ============================================================
       头像
    ============================================================ */
    .avatar {
      position: relative;
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--bg-soft);
      border: 2px solid var(--line);
      overflow: hidden;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
      font-family: var(--font-serif);
      font-size: 13px;
      transition: all var(--dur-small) var(--ease-out);
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s var(--ease-out); }
    .avatar.has-img { border-color: transparent; }
    .avatar.has-img:hover img { transform: scale(1.1); }
    .avatar .num {
      position: absolute; bottom: -3px; right: -3px;
      background: var(--bg-elev); color: var(--text-muted);
      font-size: 9px; padding: 1px 4px; border-radius: 4px;
      border: 1px solid var(--line);
      font-family: var(--font-mono);
      font-weight: 500;
      transition: all var(--dur-mid) var(--ease-smooth);
    }
    .avatar.click { cursor: pointer; }
    .avatar.click:hover {
      box-shadow: 0 0 0 3px var(--accent-glow);
      border-color: var(--accent);
      transform: scale(1.08);
    }
    .avatar.speaking {
      box-shadow: 0 0 0 3px var(--accent-glow), 0 0 12px var(--accent-glow);
      animation: speaking-ring 1.5s ease-in-out infinite;
      border-color: var(--accent);
    }
    @keyframes speaking-ring {
      0%, 100% { box-shadow: 0 0 0 3px var(--accent-glow), 0 0 12px var(--accent-glow); }
      50%       { box-shadow: 0 0 0 5px var(--accent-glow), 0 0 20px var(--accent-glow); }
    }
    body.night-mode .avatar.speaking {
      box-shadow: 0 0 0 3px rgba(123,104,238,0.4), 0 0 16px rgba(123,104,238,0.3);
      border-color: var(--night-accent);
    }
    .avatar.dead {
      opacity: 0.3;
      filter: grayscale(1);
      transition: all 0.5s var(--ease-smooth);
    }
    .avatar.dead::after {
      content: '✕';
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: var(--wolf);
      background: rgba(0,0,0,0.3);
    }

    /* ============================================================
       头像横条
    ============================================================ */
    .avatar-strip {
      display: flex; gap: 10px; align-items: center;
      padding: 12px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--bg-elev);
      overflow-x: auto;
      flex-shrink: 0;
      transition: all var(--dur-mid) var(--ease-smooth);
    }
    .avatar-strip::-webkit-scrollbar { height: 4px; }
    .avatar-strip::-webkit-scrollbar-track { background: transparent; }
    .avatar-strip::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 2px; }

    /* ============================================================
       暂停/结束横幅
    ============================================================ */
    .banner {
      padding: 10px 24px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      text-align: center;
      background: var(--bg-soft);
      color: var(--text-soft);
      flex-shrink: 0;
      transition: all var(--dur-mid) var(--ease-smooth);
      animation: banner-in 0.4s var(--ease-out);
    }
    @keyframes banner-in {
      from { transform: translateY(-100%); opacity: 0; }
      to   { transform: translateY(0); opacity: 1; }
    }
    .banner.pause {
      background: var(--wolf-soft);
      color: var(--wolf);
      border-bottom-color: var(--wolf);
    }
    .banner.over {
      background: linear-gradient(90deg, var(--accent), var(--good));
      color: #fff;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .banner.over .btn {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.4);
      color: #fff;
      margin-left: 12px;
    }
    .banner.over .btn:hover {
      background: rgba(255,255,255,0.35);
      transform: scale(1.05);
    }

    /* ============================================================
       游戏内布局
    ============================================================ */
    .app {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: calc(100vh - var(--header-h) - 56px);
      overflow: hidden;
      transition: all var(--dur-mid) var(--ease-smooth);
    }
    .app.no-strip { height: calc(100vh - var(--header-h)); }
    body.night-mode .app {
      background: var(--night-bg);
    }

    /* ---- 历史侧栏 ---- */
    .history {
      border-right: 1px solid var(--line);
      background: var(--bg-soft);
      overflow-y: auto;
      padding: 20px 14px;
      transition: all var(--dur-mid) var(--ease-smooth);
    }
    .history::-webkit-scrollbar { width: 4px; }
    .history::-webkit-scrollbar-track { background: transparent; }
    .history::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 2px; }
    body.night-mode .history { background: var(--night-soft); border-right-color: var(--night-line); }
    body.night-mode .history::-webkit-scrollbar-thumb { background: #3a3a4a; }

    .history-title {
      font-family: var(--font-serif);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 14px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      transition: all var(--dur-mid) var(--ease-smooth);
    }
    body.night-mode .history-title { border-bottom-color: var(--night-line); }

    .hist-day { margin-bottom: 16px; }
    .hist-day .day-mark {
      font-family: var(--font-serif);
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 8px;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 6px;
      transition: all var(--dur-mid) var(--ease-smooth);
    }
    body.night-mode .hist-day .day-mark { border-bottom-color: var(--night-line); }
    .hist-day .day-mark::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .hist-phase {
      font-size: 10px;
      color: var(--text-muted);
      margin: 8px 0 4px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding-left: 2px;
      transition: color var(--dur-mid) var(--ease-smooth);
    }
    .hist-item {
      padding: 7px 10px;
      margin-bottom: 4px;
      font-size: 12px;
      color: var(--text-soft);
      border-radius: var(--radius-sm);
      line-height: 1.55;
      border-left: 2px solid transparent;
      transition: all var(--dur-small) var(--ease-out);
      animation: hist-in 0.3s var(--ease-out) both;
    }
    @keyframes hist-in {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .hist-item:hover { background: var(--bg-elev); }
    .hist-item .who { color: var(--text); font-weight: 500; margin-right: 4px; }
    .hist-item.speech.wolf-camp  { border-left-color: var(--wolf); background: var(--wolf-soft); }
    .hist-item.speech.good-camp  { border-left-color: var(--good); background: var(--good-soft); }
    .hist-item.system { color: var(--text-muted); font-style: italic; }
    .hist-item.private {
      background: var(--accent-soft);
      color: var(--accent);
      border-left-color: var(--accent);
    }
    body.night-mode .hist-item.private {
      background: rgba(123,104,238,0.1);
      color: #a594f7;
    }
    .hist-item.vote { color: var(--text-muted); padding-left: 14px; }
    .hist-item.vote .arrow { color: var(--accent); margin: 0 4px; font-weight: 600; }
    body.night-mode .hist-item.vote .arrow { color: var(--night-accent); }

    /* ---- 主发言区 ---- */
    .main {
      display: flex; flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      transition: background var(--dur-mid) var(--ease-smooth);
    }
    .speeches {
      flex: 1;
      overflow-y: auto;
      padding: 28px 32px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      transition: all var(--dur-mid) var(--ease-smooth);
    }
    .speeches::-webkit-scrollbar { width: 6px; }
    .speeches::-webkit-scrollbar-track { background: transparent; }
    .speeches::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }
    body.night-mode .speeches { background: var(--night-bg); }

    .speech {
      display: flex; gap: 14px;
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
      animation: speech-in 0.35s var(--ease-out) both;
      transition: border-color var(--dur-mid) var(--ease-smooth);
    }
    body.night-mode .speech { border-bottom-color: var(--night-line); }
    @keyframes speech-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .speech:last-child { border-bottom: none; }
    .speech .who-row {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px;
    }
    .speech .name { font-weight: 600; font-size: 14px; color: var(--text); }
    .speech .role-tag {
      font-size: 10px; padding: 2px 8px;
      border-radius: 20px; font-weight: 600;
      letter-spacing: 0.04em;
      border: 1px solid;
      transition: all var(--dur-small) var(--ease-smooth);
    }
    .speech.wolf-camp .role-tag {
      background: var(--wolf-soft); color: var(--wolf);
      border-color: var(--wolf);
    }
    .speech.good-camp .role-tag {
      background: var(--good-soft); color: var(--good);
      border-color: var(--good);
    }
    body.night-mode .speech.wolf-camp .role-tag {
      background: rgba(168,64,64,0.12);
      color: #d46060;
      border-color: rgba(168,64,64,0.3);
    }
    body.night-mode .speech.good-camp .role-tag {
      background: rgba(58,122,80,0.12);
      color: #5cb87a;
      border-color: rgba(58,122,80,0.3);
    }
    .speech.system {
      padding: 10px 0; border: none;
      color: var(--text-muted);
      font-style: italic;
      font-size: 13px;
    }
    .speech.private-note {
      padding: 10px 14px;
      border: 1px dashed var(--accent);
      border-radius: var(--radius);
      background: var(--accent-soft);
      color: var(--accent-hover);
      font-size: 13px;
      animation: private-glow 2s ease-in-out infinite;
    }
    @keyframes private-glow {
      0%, 100% { box-shadow: inset 0 0 0 0 var(--accent-glow); }
      50%       { box-shadow: inset 0 0 12px 0 var(--accent-glow); }
    }
    body.night-mode .speech.private-note {
      background: rgba(123,104,238,0.08);
      border-color: rgba(123,104,238,0.3);
      color: #a594f7;
    }
    .speech .body {
      font-size: 15px; line-height: 1.75;
      color: var(--text);
      white-space: pre-wrap; word-break: break-word;
      transition: color var(--dur-mid) var(--ease-smooth);
    }
    .speech .body.system-text { font-style: italic; color: var(--text-soft); }
    .speech.streaming .body::after {
      content: "▍";
      color: var(--accent);
      animation: blink 0.9s steps(2) infinite;
      margin-left: 2px;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ---- 操作面板 ---- */
    .panel-action {
      border-top: 1px solid var(--line);
      background: var(--bg-elev);
      padding: 16px 24px;
      max-height: 300px;
      transition: all var(--dur-small) var(--ease-smooth);
      overflow: hidden;
    }
    body.night-mode .panel-action {
      background: var(--night-elev);
      border-top-color: var(--night-line);
    }
    .panel-action.collapsed { max-height: 44px; padding: 10px 24px; }
    .panel-action .panel-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-soft);
      display: flex; align-items: center; gap: 8px;
      cursor: pointer;
      user-select: none;
      transition: color var(--dur-mid) var(--ease-smooth);
    }
    .panel-action .panel-title::before {
      content: '›';
      font-size: 18px;
      line-height: 1;
      color: var(--text-muted);
      transition: transform var(--dur-small) var(--ease-out);
    }
    .panel-action:not(.collapsed) .panel-title::before {
      transform: rotate(90deg);
    }
    .panel-action.collapsed .panel-body { display: none; }
    .panel-body { padding-top: 14px; }

    .targets {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 8px;
    }
    .target {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      border-radius: var(--radius);
      background: var(--bg-soft);
      border: 1px solid var(--line);
      cursor: pointer;
      font-size: 13px;
      color: var(--text);
      transition: all var(--dur-small) var(--ease-out);
      position: relative;
      overflow: hidden;
    }
    .target::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, var(--accent-glow), transparent);
      opacity: 0;
      transition: opacity var(--dur-small) var(--ease-smooth);
    }
    .target:hover::before { opacity: 1; }
    .target:hover {
      background: var(--bg-elev);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }
    .target .avatar { width: 28px; height: 28px; font-size: 11px; z-index: 1; }
    .target span { z-index: 1; }
    .target.dead { opacity: 0.35; cursor: not-allowed; }
    .target.dead:hover { background: var(--bg-soft); border-color: var(--line); transform: none; box-shadow: none; }
    body.night-mode .target { background: var(--night-soft); border-color: var(--night-line); }
    body.night-mode .target:hover { border-color: var(--night-accent); }

    .panel-action textarea {
      width: 100%;
      min-height: 72px; max-height: 140px;
      padding: 12px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--line-strong);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      resize: vertical;
      transition: all var(--dur-small) var(--ease-smooth);
    }
    body.night-mode .panel-action textarea {
      background: var(--night-soft);
      border-color: var(--night-line);
      color: var(--night-text);
    }
    .panel-action textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .panel-actions { display: flex; gap: 8px; margin-top: 12px; }

    /* ---- 我的角色卡（可拖动） ---- */
    .my-card {
      position: fixed;
      right: 24px; bottom: 100px;
      width: 156px;
      padding: 16px;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      text-align: center;
      z-index: 10;
      box-shadow: var(--shadow-lg);
      cursor: grab;
      touch-action: none;
      user-select: none;
      transition: background var(--dur-mid) var(--ease-smooth),
                  border-color var(--dur-mid) var(--ease-smooth),
                  box-shadow var(--dur-small) var(--ease-out);
      will-change: transform;
    }
    .my-card:active { cursor: grabbing; }
    .my-card:hover {
      box-shadow: 0 16px 48px rgba(0,0,0,0.15);
      transform: translateY(-2px);
    }
    body.night-mode .my-card {
      background: var(--night-elev);
      border-color: var(--night-line);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 20px rgba(123,104,238,0.08);
    }
    body.night-mode .my-card:hover { box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 28px rgba(123,104,238,0.12); }
    .my-card .avatar {
      width: 88px; height: 88px;
      margin: 0 auto 12px;
      font-size: 28px;
      border-width: 3px;
    }
    .my-card .role-name {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      transition: color var(--dur-mid) var(--ease-smooth);
    }
    .my-card .camp {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 0.04em;
      transition: color var(--dur-mid) var(--ease-smooth);
    }
    .my-card.wolf-camp .role-name { color: var(--wolf); }
    .my-card.good-camp  .role-name { color: var(--good); }
    body.night-mode .my-card.wolf-camp .role-name { color: #d46060; }
    body.night-mode .my-card.good-camp .role-name  { color: #5cb87a; }

    /* ============================================================
       角色揭晓覆层
    ============================================================ */
    .role-reveal {
      position: fixed; inset: 0;
      z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: rgba(10,10,14,0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      animation: overlay-in 0.4s var(--ease-out);
    }
    @keyframes overlay-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .role-card {
      width: 340px;
      padding: 40px 32px;
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      text-align: center;
      box-shadow: var(--shadow-lg);
      animation: card-reveal 0.7s var(--ease-spring) both;
      position: relative;
      overflow: hidden;
    }
    body.night-mode .role-card {
      background: var(--night-elev);
      border-color: var(--night-line);
      box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 40px rgba(123,104,238,0.1);
    }
    /* 角色卡顶部装饰光 */
    .role-card::before {
      content: '';
      position: absolute; top: -40%; left: -20%;
      width: 140%; height: 80%;
      background: radial-gradient(ellipse, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
      opacity: 0.5;
    }
    body.night-mode .role-card::before {
      background: radial-gradient(ellipse, rgba(123,104,238,0.15) 0%, transparent 70%);
    }
    @keyframes card-reveal {
      0%   { transform: rotateY(90deg) scale(0.7); opacity: 0; }
      60%  { transform: rotateY(-10deg) scale(1.02); }
      100% { transform: rotateY(0deg) scale(1); opacity: 1; }
    }
    .role-card.wolf-camp::before { background: radial-gradient(ellipse, var(--wolf-glow) 0%, transparent 70%); }
    .role-card.good-camp::before  { background: radial-gradient(ellipse, var(--good-glow) 0%, transparent 70%); }

    .role-card .big-avatar {
      width: 140px; height: 140px;
      margin: 0 auto 20px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--line-strong);
      background: var(--bg-soft);
      box-shadow: 0 0 0 8px var(--bg-soft), 0 8px 32px rgba(0,0,0,0.12);
      animation: avatar-pop 0.5s 0.3s var(--ease-spring) both;
      transition: border-color var(--dur-mid) var(--ease-smooth);
    }
    body.night-mode .role-card .big-avatar {
      border-color: var(--night-line);
      box-shadow: 0 0 0 8px var(--night-soft), 0 8px 32px rgba(0,0,0,0.4), 0 0 24px var(--accent-glow);
    }
    @keyframes avatar-pop {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .role-card .big-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .role-card .reveal-label {
      font-size: 11px; color: var(--text-muted);
      letter-spacing: 0.18em; text-transform: uppercase;
      margin-bottom: 10px;
      transition: color var(--dur-mid) var(--ease-smooth);
    }
    .role-card .reveal-role {
      font-family: var(--font-serif);
      font-size: 34px; font-weight: 600;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
      transition: color var(--dur-mid) var(--ease-smooth);
    }
    .role-card .reveal-camp {
      font-size: 13px; color: var(--text-soft);
      margin-bottom: 16px;
      transition: color var(--dur-mid) var(--ease-smooth);
    }
    .role-card.wolf-camp .reveal-role { color: var(--wolf); }
    .role-card.good-camp  .reveal-role { color: var(--good); }
    body.night-mode .role-card.wolf-camp .reveal-role { color: #d46060; }
    body.night-mode .role-card.good-camp .reveal-role  { color: #5cb87a; }
    .role-card .reveal-desc {
      font-size: 13px; color: var(--text-muted);
      line-height: 1.65;
      padding: 14px 18px;
      background: var(--bg-soft);
      border-radius: var(--radius);
      margin-bottom: 24px;
      border: 1px solid var(--line);
      transition: all var(--dur-mid) var(--ease-smooth);
    }
    body.night-mode .role-card .reveal-desc {
      background: var(--night-soft);
      border-color: var(--night-line);
      color: var(--night-muted);
    }
    .role-card .reveal-partners {
      font-size: 13px; color: var(--wolf);
      margin-bottom: 24px;
      padding: 8px 14px;
      background: var(--wolf-soft);
      border-radius: var(--radius-sm);
      border: 1px solid var(--wolf);
      transition: all var(--dur-mid) var(--ease-smooth);
    }
    body.night-mode .role-card .reveal-partners {
      background: rgba(168,64,64,0.1);
      border-color: rgba(168,64,64,0.3);
      color: #d46060;
    }

    /* ============================================================
       入场动画 - 逐条延迟
    ============================================================ */
    .animate-in { animation: fade-up 0.4s var(--ease-out) both; }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-in-delay-1 { animation-delay: 0.05s; }
    .animate-in-delay-2 { animation-delay: 0.1s; }
    .animate-in-delay-3 { animation-delay: 0.15s; }
    .animate-in-delay-4 { animation-delay: 0.2s; }
    .animate-in-delay-5 { animation-delay: 0.25s; }
    .animate-in-delay-6 { animation-delay: 0.3s; }

    /* ============================================================
       响应式
    ============================================================ */
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .history { display: none; }
      .app.show-history .history {
        display: block; position: absolute; inset: 0;
        z-index: 5; background: var(--bg-soft);
        animation: slide-in-left 0.3s var(--ease-out);
      }
      @keyframes slide-in-left {
        from { transform: translateX(-100%); }
        to   { transform: translateX(0); }
      }
      .my-card { right: 12px; bottom: 80px; width: 110px; }
      .my-card .avatar { width: 70px; height: 70px; }
      .speeches { padding: 20px 16px; }
    }
    @media (max-width: 600px) {
      .lobby-card h1 { font-size: 26px; }
      .waiting { padding: 24px 16px; }
      .player-grid { grid-template-columns: 1fr; }
    }

    /* ============================================================
       上帝视角 HUD（死亡玩家全视角）
       设计：暗色半透明遮罩 + 时间线 + 折叠卡片
       氛围：低沉紫色调 + 微光呼吸，区分活人视角
       ============================================================ */
    .godview-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 25;
      display: flex;
      flex-direction: column;
      animation: gv-fade-in 1.2s var(--ease-out) both;
    }
    @keyframes gv-fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .godview-banner {
      pointer-events: auto;
      align-self: center;
      margin: 16px auto 0;
      padding: 8px 20px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(123,104,238,0.18), rgba(58,122,80,0.12));
      backdrop-filter: blur(8px);
      border: 1px solid rgba(123,104,238,0.35);
      color: var(--text);
      font-size: 13px;
      letter-spacing: 0.04em;
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .godview-banner .gv-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--night-accent);
      box-shadow: 0 0 12px var(--night-accent);
      animation: gv-pulse 2.4s var(--ease-smooth) infinite;
    }
    @keyframes gv-pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50%      { opacity: 1;   transform: scale(1.25); }
    }
    .godview-banner .gv-toggle {
      pointer-events: auto;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      color: var(--text-soft);
      border-radius: 999px;
      padding: 3px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: background var(--dur-micro) var(--ease-out);
    }
    .godview-banner .gv-toggle:hover { background: rgba(255,255,255,0.08); }

    .godview-panel {
      pointer-events: auto;
      margin: 12px 16px 16px;
      max-height: 42vh;
      overflow-y: auto;
      background: rgba(14,14,18,0.78);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(123,104,238,0.25);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 16px 18px;
      color: var(--night-text);
      animation: gv-slide-down 0.6s var(--ease-out) 0.2s both;
    }
    body:not(.night-mode) .godview-panel {
      background: rgba(26,24,20,0.84);
      color: #f0ece4;
      border-color: rgba(196,122,32,0.3);
    }
    @keyframes gv-slide-down {
      from { opacity: 0; transform: translateY(-12px); max-height: 0; }
      to   { opacity: 1; transform: translateY(0);     max-height: 42vh; }
    }
    .godview-panel.collapsed {
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      margin-top: 0;
      margin-bottom: 0;
      border-color: transparent;
      overflow: hidden;
    }
    .gv-day-block { margin-bottom: 14px; }
    .gv-day-block:last-child { margin-bottom: 0; }
    .gv-day-title {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
      color: var(--night-accent);
      margin: 0 0 8px;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    body:not(.night-mode) .gv-day-title { color: var(--accent); }
    .gv-day-title::before {
      content: "";
      display: inline-block;
      width: 14px;
      height: 1px;
      background: currentColor;
      opacity: 0.5;
    }
    .gv-phase-block { margin-bottom: 12px; }
    .gv-phase-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--night-soft-text);
      margin: 0 0 6px;
      opacity: 0.7;
    }
    body:not(.night-mode) .gv-phase-title { color: rgba(240,236,228,0.6); }
    .gv-log-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-left-width: 3px;
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-bottom: 6px;
      transition: background var(--dur-micro) var(--ease-out), transform var(--dur-small) var(--ease-spring);
      cursor: pointer;
      animation: gv-card-in 0.5s var(--ease-out) both;
    }
    @keyframes gv-card-in {
      from { opacity: 0; transform: translateX(-6px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .gv-log-card:hover {
      background: rgba(255,255,255,0.07);
      transform: translateX(2px);
    }
    .gv-log-card.gv-wolf     { border-left-color: var(--wolf); }
    .gv-log-card.gv-divine   { border-left-color: var(--night-accent); }
    .gv-log-card.gv-witch    { border-left-color: #c45a8c; }
    .gv-log-card.gv-guard    { border-left-color: var(--good); }
    .gv-log-card.gv-hunter   { border-left-color: #d97706; }
    .gv-log-card.gv-vote     { border-left-color: rgba(255,255,255,0.35); }
    .gv-log-card.gv-default  { border-left-color: rgba(255,255,255,0.25); }
    .gv-log-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }
    .gv-log-kind {
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .gv-log-actor { opacity: 0.85; }
    .gv-log-target {
      margin-left: auto;
      padding: 2px 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }
    .gv-log-thinking {
      margin-top: 8px;
      padding: 8px 10px;
      background: rgba(0,0,0,0.25);
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      line-height: 1.55;
      color: rgba(240,236,228,0.85);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 200px;
      overflow-y: auto;
    }
    .gv-log-thinking-empty {
      opacity: 0.55;
      font-style: italic;
      font-size: 12px;
      margin-top: 6px;
    }
    .gv-log-proposals {
      margin-top: 6px;
      font-size: 12px;
      color: rgba(240,236,228,0.7);
      line-height: 1.55;
    }
    .gv-log-proposals span { margin-right: 12px; }
    .gv-empty {
      text-align: center;
      padding: 24px 8px;
      color: var(--night-soft-text);
      opacity: 0.6;
      font-size: 13px;
    }
  </style>
</head>
<body>
<div x-data="app()">

  <!-- ============ Header ============ -->
  <div class="header">
    <div class="brand">
      <span class="brand-dot"></span>
      <span>AI 狼人杀</span>
    </div>

    <template x-if="inRoom && gameStarted">
      <div class="meta">
        <span class="pill" x-text="'房间 ' + room.code"></span>
        <span class="pill" :class="phaseClass()" x-text="'第 ' + game.day + ' 天 · ' + phase"></span>
      </div>
    </template>
    <template x-if="inRoom && !gameStarted">
      <div class="meta">
        <span class="pill" x-text="'房间 ' + room.code"></span>
        <span class="pill">等待开始</span>
      </div>
    </template>

    <button class="btn btn-ghost btn-sm"
            x-show="gameStarted && window.innerWidth < 900"
            @click="collapsedHistory = !collapsedHistory"
            x-text="collapsedHistory ? '查看历史' : '收起历史'"
            style="margin-left:auto"></button>

    <div class="conn" :class="{ live: ws && ws.readyState === 1 }" x-text="connStatus"></div>
    <div class="tts-indicator"
         x-show="ttsEnabled"
         :class="{ 'tts-speaking': ttsStatus === '正在播报', 'tts-error': ttsStatus === '语音服务暂时不可用' }"
         x-text="ttsStatus"></div>
  </div>

  <!-- ============ 头像横条（仅游戏内） ============ -->
  <div class="avatar-strip" x-show="gameStarted">
    <template x-for="p in sortedPlayers()" :key="p.player_id">
      <div class="avatar click"
           :class="{
             speaking: speakingNow === p.player_id,
             dead: isDead(p.player_id),
             'has-img': canSeeRole(p.player_id)
           }"
           :title="canSeeRole(p.player_id) ? (deadRole(p.player_id) || p.role || '未知') : ''">
        <template x-if="canSeeRole(p.player_id)">
          <img :src="roleImage(deadRole(p.player_id) || p.role)" :alt="deadRole(p.player_id) || p.role">
        </template>
        <template x-if="!canSeeRole(p.player_id)">
          <span>?</span>
        </template>
        <span class="num" x-text="p.player_id"></span>
      </div>
    </template>
  </div>

  <!-- ============ 暂停/结束横幅 ============ -->
  <div class="banner pause" x-show="paused" x-cloak>
    游戏暂停 — <span x-text="pausedReason"></span>
  </div>
  <div class="banner over" x-show="phase === '结束'" x-cloak>
    游戏结束：<span x-text="winnerText"></span>
    <button class="btn btn-sm" @click="playAgain">再来一局</button>
  </div>

  <!-- ============ 首页 ============ -->
  <div class="lobby" x-show="!inRoom" x-cloak>
    <div class="lobby-card">
      <h1 class="animate-in">加入一局狼人杀</h1>
      <div class="subtitle animate-in animate-in-delay-1">与 AI 同局，体验逐字发言的角色扮演推理</div>

      <div class="panel animate-in animate-in-delay-2">
        <div class="panel-body">
          <div class="form-row">
            <label>你的昵称</label>
            <input x-model="nickname" placeholder="例如：小明的猫" autocomplete="off">
          </div>
          <div class="form-row">
            <label>选择人数（房主设置）</label>
            <select x-model="playerCount">
              <option value="6">6 人局</option>
              <option value="9" selected>9 人局</option>
              <option value="12">12 人局</option>
            </select>
          </div>
          <button class="btn btn-primary btn-full animate-in animate-in-delay-3"
                  @click="createRoom"
                  :disabled="!canCreate">
            创建房间
          </button>
        </div>
      </div>

      <div class="panel animate-in animate-in-delay-4">
        <div class="panel-body">
          <div class="form-row">
            <label>或加入已有房间</label>
            <input x-model="roomCode" placeholder="输入房间码" autocomplete="off">
          </div>
          <button class="btn btn-primary btn-full animate-in animate-in-delay-5"
                  @click="joinRoom"
                  :disabled="!canJoin">
            加入房间
          </button>
        </div>
      </div>

      <div class="panel animate-in animate-in-delay-6">
        <div class="panel-body">
          <div style="display:flex;align-items:center;gap:10px">
            <label style="font-size:13px;color:var(--text-soft);margin:0;cursor:pointer;display:flex;align-items:center;gap:8px">
              <input type="checkbox" x-model="ttsEnabled" style="width:16px;height:16px;cursor:pointer">
              开启语音播报
            </label>
            <span style="font-size:12px;color:var(--text-muted)">需服务端 TTS_ENABLED=1</span>
          </div>
        </div>
      </div>

      <div class="form-hint animate-in animate-in-delay-6" x-show="!audioReady">
        点击按钮后语音才会启用（浏览器限制）
      </div>
    </div>
  </div>

  <!-- ============ 房间大厅 ============ -->
  <template x-if="inRoom && !gameStarted">
  <div class="waiting" x-cloak>
    <div class="container">
      <h2>等待房主开始</h2>
      <div class="sub">
        当前
        <span x-text="room.players?.length ?? 0"></span> /
        <span x-text="room.max_players"></span> 人
        <span x-show="roomMode === 'private'" style="color:var(--wolf);margin-left:8px">私密房间</span>
        <span x-show="roomMode === 'open'"   style="color:var(--good);margin-left:8px">公开房间</span>
      </div>

      <!-- 人数进度条 -->
      <div class="player-count-bar">
        <div class="bar-track">
          <div class="bar-fill"
               :style="'width:' + ((room.players?.length ?? 0) / room.max_players * 100) + '%'"></div>
        </div>
        <span style="font-size:12px;color:var(--text-muted);white-space:nowrap">
          <span x-text="room.players?.length ?? 0"></span>/<span x-text="room.max_players"></span>
        </span>
      </div>

      <div class="player-grid">
        <template x-for="p in room.players" :key="p.player_id">
          <div class="player-tile">
            <div class="tile-avatar">
              <span x-text="p.is_ai ? 'AI' : '?'"></span>
            </div>
            <div class="tile-meta">
              <div class="tile-name">
                <span x-show="p.is_host" class="tile-host-badge">房主</span>
                <span x-text="p.nickname"></span>
              </div>
              <div class="tile-tag">
                <span x-show="p.is_ai">AI 玩家</span>
                <span x-show="!p.is_ai">人类玩家</span>
                <span x-show="!p.connected" style="color:var(--wolf);margin-left:4px">· 掉线</span>
              </div>
            </div>
          </div>
        </template>
      </div>

      <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap">
        <button class="btn btn-primary"
                @click="startGame"
                :disabled="!isHost"
                x-text="isHost ? ('开始游戏（AI 补满 ' + (room.max_players - (room.players?.length ?? 0)) + ' 人）') : '等待房主开始…'">
        </button>
        <button class="btn btn-sm"
                x-show="isHost && !gameStarted"
                @click="togglePrivateMode(roomMode !== 'private')"
                x-text="roomMode === 'private' ? '切换为公开模式' : '切换为私密模式'">
        </button>
      </div>
    </div>
  </div>
  </template>

  <!-- ============ 游戏内 ============ -->
  <template x-if="inRoom && gameStarted">
    <div class="app" :class="{ 'show-history': !collapsedHistory }">

      <!-- 历史侧栏 -->
      <div class="history" x-ref="history">
        <!-- 游戏结束后完整复盘 -->
        <template x-if="showFinalRoles && fullRecord.length">
          <div>
            <div class="history-title">完整复盘</div>
            <template x-for="(rec, ri) in fullRecord" :key="ri">
              <div class="hist-day">
                <div class="day-mark">第 <span x-text="rec.day"></span> 天</div>
                <template x-if="rec.type === 'speech_round'">
                  <div>
                    <template x-for="s in rec.speeches" :key="s.player_id">
                      <div class="hist-item speech"
                           :class="s.player_id && canSeeRole(s.player_id) && deadRole(s.player_id)?.includes('狼人') ? 'wolf-camp' : 'good-camp'">
                        <span class="who" x-text="(s.player_id + '号玩家') + '：'"></span>
                        <span x-text="s.text"></span>
                      </div>
                    </template>
                  </div>
                </template>
                <template x-if="rec.type === 'divine'">
                  <div class="hist-item private"
                       x-text="'预言家(' + rec.seer + '号)查验了 ' + rec.target + '号 → ' + rec.result"></div>
                </template>
                <template x-if="rec.type === 'death'">
                  <div class="hist-item system"
                       x-text="'天亮：' + rec.died.map(d => d + '号玩家').join('、') + ' 死亡'"></div>
                </template>
                <template x-if="rec.type === 'execution'">
                  <div class="hist-item system" x-text="rec.executed + '号玩家被投票放逐'"></div>
                </template>
                <template x-if="rec.type === 'night_thinking'">
                  <div>
                    <div class="hist-item system" x-text="'夜晚各方决策思考：'"></div>
                    <template x-for="(th, pid) in rec.thinking" :key="pid">
                      <div class="hist-item private">
                        <span class="who" x-text="pid + '号：'"></span>
                        <span style="white-space:pre-wrap" x-text="th"></span>
                      </div>
                    </template>
                  </div>
                </template>
                <template x-if="rec.type === 'vote_round'">
                  <div>
                    <div class="hist-item system" x-text="'白天投票（含思考）：'"></div>
                    <template x-for="v in rec.votes" :key="v.voter">
                      <div class="hist-item vote">
                        <span x-text="v.voter + '号'"></span>
                        <span class="arrow">→</span>
                        <span x-text="v.target ? (v.target + '号') : '弃权'"></span>
                        <div x-show="rec.thinking && rec.thinking[v.voter]"
                             style="font-size:11px; color:var(--text-muted); margin-top:3px; white-space:pre-wrap; font-style:italic"
                             x-text="'思考：' + (rec.thinking[v.voter] || '')"></div>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
          </div>
        <!-- 游戏结束后 AI 玩家复盘 -->
        <template x-if="showFinalRoles && postGameReviews.length">
          <div style="margin-top: 16px;">
            <div class="history-title">玩家复盘</div>
            <template x-for="rev in postGameReviews" :key="rev.player_id">
              <div class="hist-item speech"
                   :class="rev.role && rev.role.includes('狼人') ? 'wolf-camp' : 'good-camp'"
                   style="margin-bottom: 12px;">
                <div style="font-weight: 600; margin-bottom: 4px;">
                  <span x-text="rev.player_id + '号玩家'"></span>
                  <span style="font-size: 11px; color: var(--text-muted); margin-left: 6px;"
                        x-text="'(' + rev.role + ')'"></span>
                </div>
                <div style="white-space: pre-wrap; font-size: 13px; line-height: 1.6;"
                     x-text="rev.text"></div>
              </div>
            </template>
          </div>
        </template>
        </template>

        <!-- 游戏进行中的常规历史 -->
        <template x-if="!showFinalRoles || !fullRecord.length">
        <div>
          <div class="history-title">历史记录</div>
          <template x-for="(group, gi) in historyGroups()" :key="gi">
            <div class="hist-day">
              <div class="day-mark">第 <span x-text="group.day"></span> 天</div>
              <template x-for="(ev, ei) in group.events" :key="ei">
                <div>
                  <div class="hist-phase" x-show="ev.showPhase" x-text="ev.phase"></div>
                  <div x-show="ev.kind === 'phase'"
                       class="hist-item system"
                       x-text="'进入 ' + ev.phase + ' 阶段'"></div>
                  <div x-show="ev.kind === 'system' || ev.kind === 'private' || ev.kind === 'over'"
                       class="hist-item"
                       :class="ev.kind === 'private' ? 'private' : 'system'"
                       x-text="ev.kind === 'over' ? ('胜方：' + ev.winner) : ev.text"></div>
                  <div x-show="ev.kind === 'speech'"
                       class="hist-item speech"
                       :class="ev.role && ev.role.includes('狼人') ? 'wolf-camp' : 'good-camp'">
                    <span class="who" x-text="(ev.player_id ? (ev.player_id + '号玩家') : '旁白') + '：'"></span>
                    <span x-text="ev.text"></span>
                  </div>
                  <div x-show="ev.kind === 'vote'" class="hist-item vote">
                    <span x-text="ev.voter_name || ''"></span>
                    <span class="arrow">→</span>
                    <span x-text="ev.target_name || ''"></span>
                  </div>
                  <div x-show="ev.kind === 'vote_result'"
                       class="hist-item system"
                       x-text="'放逐：' + (ev.eliminated_name || '（平票）')"></div>
                </div>
              </template>
            </div>
          </template>
          <div x-show="speechHistory.length === 0"
               style="color:var(--text-muted); font-size:13px; text-align:center; padding:24px; font-style:italic">
            暂无记录
          </div>
        </div>
        </template>
      </div>

      <!-- 主发言区 + 操作面板 -->
      <div class="main">
        <div class="speeches" x-ref="speeches" @scroll.passive="gameStarted && _onScroll()">
          <template x-for="(s, i) in speeches" :key="i">
            <div class="speech" :class="speechClass(s)">
              <div class="avatar"
                   :class="{'has-img': s.role && canSeeRole(s.player_id)}"
                   x-show="s.nickname !== '旁白'">
                <template x-if="s.role && canSeeRole(s.player_id)">
                  <img :src="roleImage(s.role)" :alt="s.role">
                </template>
                <template x-if="!s.role || !canSeeRole(s.player_id)">
                  <span>?</span>
                </template>
                <span class="num" x-text="s.player_id"></span>
              </div>
              <div style="flex:1; min-width:0">
                <div class="who-row" x-show="s.nickname !== '旁白'">
                  <span class="name" x-text="s.nickname"></span>
                  <span class="role-tag" x-show="s.role && canSeeRole(s.player_id)" x-text="s.role"></span>
                </div>
                <div class="body"
                     :class="{ 'system-text': s.nickname === '旁白', streaming: s.player_id === speakingNow && !s.final }"
                     x-text="s.text"></div>
              </div>
            </div>
          </template>
        </div>

        <!-- 操作面板 -->
        <div class="panel-action" :class="{ collapsed: !needAct }">
          <div class="panel-title" @click="needAct = needAct">
            <span x-show="needAct" x-text="actTitle"></span>
            <span x-show="!needAct && currentSpeakerLabel" x-text="currentSpeakerLabel"></span>
            <span x-show="!needAct && !currentSpeakerLabel && phase !== '结束'">
              <span x-text="voteStatus || '等待中'"></span>
            </span>
          </div>
          <div class="panel-body">
            <div x-show="actType === 'target' || actType === 'vote'">
              <div class="targets">
                <template x-for="p in actTargets()" :key="p.player_id">
                  <button class="target"
                          :class="{ dead: !aliveSet.has(p.player_id) }"
                          :disabled="!aliveSet.has(p.player_id)"
                          @click="submitAct(p.player_id)">
                    <div class="avatar" :class="{'has-img': canSeeRole(p.player_id)}">
                      <template x-if="canSeeRole(p.player_id)">
                        <img :src="roleImage(deadRole(p.player_id) || p.role)" :alt="deadRole(p.player_id) || p.role">
                      </template>
                      <template x-if="!canSeeRole(p.player_id)">
                        <span>?</span>
                      </template>
                    </div>
                    <span x-text="playerLabel(p.player_id)"></span>
                  </button>
                </template>
              </div>
            </div>

            <div x-show="actType === 'bool'">
              <div class="panel-actions">
                <button class="btn btn-primary" @click="submitAct(true)">使用</button>
                <button class="btn" @click="submitAct(false)">不使用</button>
              </div>
            </div>

            <div x-show="actType === 'speech'">
              <textarea x-model="speechInput" placeholder="输入你的发言…" rows="3"></textarea>
              <div class="panel-actions">
                <button class="btn btn-primary" @click="submitSpeech">结束发言</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 我的角色卡（可拖动） -->
        <div class="my-card"
             :class="myCamp === '狼人阵营' ? 'wolf-camp' : 'good-camp'"
             x-show="myRole && !roleReveal"
             :style="{ left: cardX + 'px', top: cardY + 'px', right: 'auto', bottom: 'auto' }"
             x-data="{}"
             @mousedown="cardDragStart($event)"
             @touchstart="cardDragStart($event)">
          <div class="avatar has-img">
            <img :src="roleImage(myRole)" :alt="myRole">
          </div>
          <div class="role-name" x-text="playerLabel(myId)"></div>
          <div class="camp" x-text="myRole + ' · ' + myCamp"></div>
        </div>
      </div>
    </div>
  </template>

  <!-- ============ 角色揭晓覆层 ============ -->
  <div class="role-reveal" x-show="roleReveal" x-cloak @click="confirmRole">
    <div class="role-card"
         :class="myCamp === '狼人阵营' ? 'wolf-camp' : 'good-camp'"
         @click.stop>
      <div class="reveal-label">你的身份</div>
      <div class="big-avatar">
        <img :src="roleImage(myRole)" :alt="myRole">
      </div>
      <div class="reveal-role" x-text="myRole"></div>
      <div class="reveal-camp" x-text="playerLabel(myId) + ' · ' + myCamp"></div>
      <div class="reveal-desc" x-text="roleDesc(myRole)"></div>
      <div class="reveal-partners"
           x-show="myRole === '狼人' && wolfPartners.length"
           x-text="'你的狼人同伴：' + wolfPartners.join('号玩家、') + '号玩家'"></div>
      <button class="btn btn-primary btn-full" @click="confirmRole">确认，进入游戏</button>
    </div>
  </div>

  <!-- ============ 上帝视角 HUD（死亡玩家全视角） ============ -->
  <div class="godview-overlay" x-show="iAmDead" x-cloak>
    <div class="godview-banner">
      <span class="gv-dot"></span>
      <span>上帝视角 · 已解锁</span>
      <button class="gv-toggle" @click="godViewExpanded['__banner_toggle'] = !godViewExpanded['__banner_toggle']">
        <span x-show="!godViewExpanded['__banner_toggle']">展开</span>
        <span x-show="godViewExpanded['__banner_toggle']">收起</span>
      </button>
    </div>
    <div class="godview-panel"
         :class="{ collapsed: !godViewExpanded['__banner_toggle'] }"
         x-show="godViewExpanded['__banner_toggle']">
      <template x-if="decisionLogs.length === 0">
        <div class="gv-empty">暂无决策日志</div>
      </template>
      <template x-for="dayGroup in godViewLogsByDay()" :key="'day-' + dayGroup.day">
        <div class="gv-day-block">
          <div class="gv-day-title" x-text="'第 ' + dayGroup.day + ' 天'"></div>
          <template x-for="phaseGroup in godViewLogsByPhase(dayGroup)" :key="'phase-' + dayGroup.day + '-' + phaseGroup.phase">
            <div class="gv-phase-block">
              <div class="gv-phase-title" x-text="phaseGroup.phase"></div>
              <template x-for="(log, idx) in phaseGroup.logs" :key="godViewLogKey(log, idx)">
                <div class="gv-log-card" :class="godViewKindClass(log.kind)" @click="toggleGodViewLog(log, idx)">
                  <div class="gv-log-head">
                    <span class="gv-log-kind" x-text="log.kind_label || log.kind"></span>
                    <span class="gv-log-actor" x-text="'· ' + godViewActorLabel(log)"></span>
                    <span class="gv-log-target" x-text="godViewDecisionLabel(log)"></span>
                  </div>
                  <template x-if="log.thinking && godViewIsExpanded(log, idx)">
                    <div class="gv-log-thinking" x-text="log.thinking"></div>
                  </template>
                  <template x-if="!log.thinking && godViewIsExpanded(log, idx)">
                    <div class="gv-log-thinking-empty">（人类玩家决策，无 AI 思考记录）</div>
                  </template>
                  <template x-if="log.proposals && log.proposals.length && godViewIsExpanded(log, idx)">
                    <div class="gv-log-proposals">
                      <template x-for="p in log.proposals" :key="'prop-' + dayGroup.day + '-' + log.kind + '-' + p.wolf_id">
                        <span x-text="(p.wolf_nickname || (p.wolf_id + '号玩家')) + ' 提议 ' + (p.target_id ? (p.target_id + '号玩家') : '弃权')"></span>
                      </template>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
<script src="/static/alpine.min.js" defer></script>
</body>
</html>
