<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#fff"/>
  <!-- DNA double helix simplified -->
  <path d="M120,40 Q200,80 120,120 Q40,160 120,200 Q200,240 120,280" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
  <path d="M280,40 Q200,80 280,120 Q360,160 280,200 Q200,240 280,280" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Rungs -->
  <line x1="140" y1="60" x2="260" y2="60" stroke="#0a0a0a" stroke-width="0.8" opacity="0.5"/>
  <line x1="140" y1="100" x2="260" y2="100" stroke="#0a0a0a" stroke-width="0.8" opacity="0.5"/>
  <line x1="120" y1="140" x2="280" y2="140" stroke="#0a0a0a" stroke-width="0.8" opacity="0.5"/>
  <line x1="140" y1="180" x2="260" y2="180" stroke="#0a0a0a" stroke-width="0.8" opacity="0.5"/>
  <line x1="140" y1="220" x2="260" y2="220" stroke="#0a0a0a" stroke-width="0.8" opacity="0.5"/>
  <line x1="140" y1="260" x2="260" y2="260" stroke="#0a0a0a" stroke-width="0.8" opacity="0.5"/>
  <!-- Edit points -->
  <circle cx="200" cy="140" r="6" fill="#0a0a0a" opacity="0.15"/>
  <circle cx="200" cy="140" r="2" fill="#0a0a0a"/>
  <circle cx="160" cy="220" r="4" fill="#0a0a0a" opacity="0.1"/>
  <circle cx="240" cy="60" r="4" fill="#0a0a0a" opacity="0.1"/>
</svg>
