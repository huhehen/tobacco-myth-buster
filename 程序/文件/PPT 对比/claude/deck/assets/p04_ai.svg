<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#fff"/>
  <!-- Neural network nodes -->
  <circle cx="200" cy="80" r="6" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle cx="130" cy="150" r="5" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle cx="270" cy="150" r="5" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle cx="100" cy="220" r="4" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle cx="200" cy="220" r="5" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle cx="300" cy="220" r="4" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
  <!-- Connections -->
  <line x1="200" y1="80" x2="130" y2="150" stroke="#0a0a0a" stroke-width="0.8" opacity="0.6"/>
  <line x1="200" y1="80" x2="270" y2="150" stroke="#0a0a0a" stroke-width="0.8" opacity="0.6"/>
  <line x1="130" y1="150" x2="100" y2="220" stroke="#0a0a0a" stroke-width="0.8" opacity="0.6"/>
  <line x1="130" y1="150" x2="200" y2="220" stroke="#0a0a0a" stroke-width="0.8" opacity="0.6"/>
  <line x1="270" y1="150" x2="200" y2="220" stroke="#0a0a0a" stroke-width="0.8" opacity="0.6"/>
  <line x1="270" y1="150" x2="300" y2="220" stroke="#0a0a0a" stroke-width="0.8" opacity="0.6"/>
  <line x1="200" y1="80" x2="200" y2="220" stroke="#0a0a0a" stroke-width="0.8" opacity="0.6"/>
  <!-- Abstract circuit lines -->
  <path d="M40,60 L80,60 L100,80 L100,120" fill="none" stroke="#0a0a0a" stroke-width="0.8" opacity="0.3"/>
  <path d="M360,60 L320,60 L300,80 L300,120" fill="none" stroke="#0a0a0a" stroke-width="0.8" opacity="0.3"/>
  <path d="M60,260 L100,260 L120,240 L120,200" fill="none" stroke="#0a0a0a" stroke-width="0.8" opacity="0.3"/>
  <path d="M340,260 L300,260 L280,240 L280,200" fill="none" stroke="#0a0a0a" stroke-width="0.8" opacity="0.3"/>
  <!-- Center glow hint -->
  <circle cx="200" cy="150" r="40" fill="none" stroke="#0a0a0a" stroke-width="0.5" opacity="0.15"/>
  <circle cx="200" cy="150" r="60" fill="none" stroke="#0a0a0a" stroke-width="0.5" opacity="0.1"/>
</svg>
