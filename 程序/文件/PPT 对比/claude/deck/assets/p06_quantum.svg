<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#fff"/>
  <!-- Qubit spheres representation -->
  <ellipse cx="200" cy="150" rx="120" ry="40" fill="none" stroke="#0a0a0a" stroke-width="1" opacity="0.2"/>
  <ellipse cx="200" cy="150" rx="40" ry="120" fill="none" stroke="#0a0a0a" stroke-width="1" opacity="0.2"/>
  <ellipse cx="200" cy="150" rx="120" ry="40" fill="none" stroke="#0a0a0a" stroke-width="1" opacity="0.2" transform="rotate(60,200,150)"/>
  <ellipse cx="200" cy="150" rx="120" ry="40" fill="none" stroke="#0a0a0a" stroke-width="1" opacity="0.2" transform="rotate(-60,200,150)"/>
  <!-- Core circle -->
  <circle cx="200" cy="150" r="12" fill="none" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle cx="200" cy="150" r="3" fill="#0a0a0a"/>
  <!-- Orbiting dots -->
  <circle cx="200" cy="30" r="4" fill="none" stroke="#0a0a0a" stroke-width="1.2"/>
  <circle cx="200" cy="270" r="4" fill="none" stroke="#0a0a0a" stroke-width="1.2"/>
  <circle cx="80" cy="150" r="4" fill="none" stroke="#0a0a0a" stroke-width="1.2"/>
  <circle cx="320" cy="150" r="4" fill="none" stroke="#0a0a0a" stroke-width="1.2"/>
  <!-- Binary decoration -->
  <text x="30" y="40" font-family="monospace" font-size="10" fill="#0a0a0a" opacity="0.3">01</text>
  <text x="30" y="55" font-family="monospace" font-size="10" fill="#0a0a0a" opacity="0.3">10</text>
  <text x="350" y="255" font-family="monospace" font-size="10" fill="#0a0a0a" opacity="0.3">11</text>
  <text x="350" y="270" font-family="monospace" font-size="10" fill="#0a0a0a" opacity="0.3">00</text>
</svg>
